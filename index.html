<style>
  /* Layout: full-bleed shader view. Wordmark top-left, one quiet row of controls along the bottom: modes left, colour / intensity / sound right. Single dark look by choice. */
  :root {
    --void: #08060f;
    --text: #ece8ff;
    --text-dim: #8d88a8;
    --edge: rgba(200, 190, 255, 0.22);
    --accent: #ff7ad9;
    --display: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--void);
    color: var(--text);
    font-family: var(--mono);
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #view.down { cursor: grabbing; }
  h1 {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: max(16px, env(safe-area-inset-left, 0px));
    margin: 0;
    padding-top: 24px;
    font-family: var(--display);
    font-weight: 400;
    font-size: 0.78rem;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    line-height: 1;
    pointer-events: none;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
  }
  .prog {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    transform: scaleX(0);
    transform-origin: left;
    background: linear-gradient(90deg, var(--accent), #7a8cff);
    opacity: 0;
    transition: opacity 0.6s;
    pointer-events: none;
    z-index: 5;
  }
  .prog.on { opacity: 0.9; }
  .caption {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: max(16px, env(safe-area-inset-left, 0px));
    margin: 0;
    padding-top: 46px;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    text-shadow: 0 0 16px rgba(0, 0, 0, 0.9);
    pointer-events: none;
  }
  .hint {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    right: max(16px, env(safe-area-inset-right, 0px));
    margin: 0;
    padding-top: 25px;
    font-size: 0.64rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    text-shadow: 0 0 16px rgba(0, 0, 0, 0.8);
    pointer-events: none;
    transition: opacity 2s ease;
  }
  .hint.quiet { opacity: 0; }
  .bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 2px 20px;
    pointer-events: none;
  }
  .bar > * { pointer-events: auto; }
  .group { display: flex; align-items: center; gap: 4px; }
  .txt {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-dim);
    font: inherit;
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    height: 32px;
    padding: 0 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    position: relative;
    text-shadow: 0 0 14px rgba(0, 0, 0, 0.9);
    transition: color 0.25s;
  }
  .txt:hover { color: var(--text); }
  .txt[aria-pressed="true"] { color: var(--text); }
  .modes .txt::after {
    content: "";
    position: absolute;
    left: 8px; right: 8px; bottom: 4px;
    height: 1px;
    background: var(--text);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s ease;
  }
  .modes .txt[aria-pressed="true"]::after { transform: scaleX(1); }
  .dot {
    appearance: none;
    border: 0;
    background: transparent;
    width: 28px;
    height: 32px;
    padding: 0;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .dot i {
    display: block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    opacity: 0.5;
    transition: transform 0.3s, opacity 0.3s, box-shadow 0.3s;
  }
  .dot:hover i { opacity: 0.9; }

    /* ---- instruments ---- */
    function padVoice(freq, t, dur, attack, vol, shim) {
      const g = mk("createGain");
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + attack);
      g.gain.setValueAtTime(vol, t + dur);
      g.gain.linearRampToValueAtTime(0.0001, t + dur + 5.5);
      g.connect(N.padBus);
      [["sawtooth", 1, 9, -0.65, 0.17], ["sawtooth", 1, -9, 0.65, 0.17], ["triangle", 1, 0, 0, 0.8], ["sine", 2, 0, 0, shim === undefined ? 0.1 : shim]].forEach(([type, mul, cents, pan, amp]) => {
        const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq * mul; o.detune.value = cents;
        N.detuneMod.connect(o.detune); o.onended = () => { try { N.detuneMod.disconnect(o.detune); } catch (e) {} };
        const a = mk("createGain", amp), p = ctx.createStereoPanner(); p.pan.value = pan;
        o.connect(a); a.connect(p); p.connect(g);
        o.start(t); o.stop(t + dur + 6);
      });
    }
    function choirVoice(freq, t, dur, attack, vol) {
      const g = mk("createGain");
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack);
      g.gain.setValueAtTime(vol, t + dur); g.gain.linearRampToValueAtTime(0.0001, t + dur + 6);
      const p = ctx.createStereoPanner(); p.pan.value = Math.random() * 0.8 - 0.4; g.connect(p); p.connect(N.padBus);
      const src = [];
      [-6, 6].forEach(c => {
        const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = freq; o.detune.value = c;
        N.detuneMod.connect(o.detune); o.onended = () => { try { N.detuneMod.disconnect(o.detune); } catch (e) {} };
        src.push(o);
      });
      [[730, 8, 1, N.formG1], [1090, 9, 0.6, N.formG2], [2440, 10, 0.25, null]].forEach(([f, q, amp, lfo]) => {
        const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
        if (lfo) { lfo.connect(bp.frequency); setTimeout(() => { try { lfo.disconnect(bp.frequency); } catch (e) {} }, (dur + 8) * 1000); }
        const a = mk("createGain", amp); src.forEach(o => o.connect(bp)); bp.connect(a); a.connect(g);
      });

    }
    function twinkle(t) {
      const P = PALETTES[key];
      const f = mtof(degNote(P, 14 + Math.floor(Math.random() * 11)));
      const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f;
      const g = mk("createGain"); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
      const p = ctx.createStereoPanner(); p.pan.value = Math.random() * 1.8 - 0.9;
      o.connect(g); g.connect(p); p.connect(N.bellBus); o.start(t); o.stop(t + 1.7);
    }
    function playChord(t) {
      const P = PALETTES[key];
      const deg = P.prog[chordStep % P.prog.length]; chordStep++;
      timeline.push({ t, deg }); if (timeline.length > 6) timeline.shift();
      const vol = mode === 1 ? 0.12 : mode === 3 ? 0.08 : 0.13;
      [0, 2, 4, 6].forEach((s, i) => padVoice(mtof(degNote(P, deg + s) - (i === 0 ? 12 : 0)), t, CHORD_LEN[mode] + 0.5, PAD_ATTACK[mode], vol, mode === 3 ? 0.3 : 0.1));
      if (mode === 3) [0, 4, 7].forEach(s => choirVoice(mtof(degNote(P, deg + s) + 12), t, CHORD_LEN[mode] + 0.5, PAD_ATTACK[mode], 0.2));
      N.sub.frequency.setTargetAtTime(mtof(degNote(P, deg) - 24 + 12), t, 0.8);
      N.drone.frequency.setTargetAtTime(mtof(degNote(P, deg) - 24), t, 1.2);
      N.drone2.frequency.setTargetAtTime(mtof(degNote(P, deg) - 24), t, 1.2);
    }
    function bell(t) {
      const P = PALETTES[key];
      const lo = mode === 2 ? 8 : 13, hi = mode === 2 ? 20 : 25;
      bellDeg = Math.max(lo, Math.min(hi, bellDeg + [-2, -1, -1, 1, 1, 2, 3][Math.floor(Math.random() * 7)]));
      const f = mtof(degNote(P, bellDeg));
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.random() * 1.4 - 0.7; pan.connect(N.bellBus);
      const g = mk("createGain");
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.26, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.6);
      g.connect(pan);
      [[1, 1, 3.6], [2.76, 0.28, 1.4], [5.4, 0.08, 0.5]].forEach(([mul, amp, len]) => {
        const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f * mul;
        const a = mk("createGain"); a.gain.setValueAtTime(amp, t); a.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(a); a.connect(g); o.start(t); o.stop(t + len + 0.1);
      });
    }
    function glide(t) {
      const P = PALETTES[key];
      const d = [7, 9, 11, 14][Math.floor(Math.random() * 4)];
      const f1 = mtof(degNote(P, d)), f2 = f1 * Math.pow(2, ([-5, 7, 2, -7][Math.floor(Math.random() * 4)]) / 12);
      const o = ctx.createOscillator(); o.type = "sine";

      N.detuneMod.connect(o.detune); o.onended = () => { try { N.detuneMod.disconnect(o.detune); } catch (e) {} };
      const g = mk("createGain");
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.16, t + 2.4); g.gain.linearRampToValueAtTime(0.0001, t + 6.5);
      const p = ctx.createStereoPanner(); p.pan.value = Math.random() * 1.2 - 0.6;

    }
    function pluck(t, freq, accent) {
      const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
      o1.type = "sawtooth"; o2.type = "square"; o1.frequency.value = freq; o2.frequency.value = freq; o2.detune.value = 7;
      const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 6;

      const g = mk("createGain"); const v = accent ? 0.2 : 0.12;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
      const a1 = mk("createGain", 0.6), a2 = mk("createGain", 0.35);
      const p = ctx.createStereoPanner(); p.pan.value = Math.random() * 0.8 - 0.4;
      o1.connect(a1); o2.connect(a2); a1.connect(f); a2.connect(f); f.connect(g); g.connect(p); p.connect(N.arpBus);
      o1.start(t); o2.start(t); o1.stop(t + 0.4); o2.stop(t + 0.4);
    }
    function kick(t, vol) {
      const o = ctx.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.15);
      const g = mk("createGain");
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      o.connect(g); g.connect(N.lowBus); o.start(t); o.stop(t + 0.45);

    }
    function hat(t) {
      const s = ctx.createBufferSource(); s.buffer = noiseBuf;
      const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 7500;
      const g = mk("createGain"); g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);

    }
    function bass(t, freq) {
      const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = freq;
      const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 4;
      f.frequency.setValueAtTime(700, t); f.frequency.exponentialRampToValueAtTime(140, t + 0.22);

    }
    function stepEvent4(t, i) {
      const P = PALETTES[key];
      const deg = degAt(t), s = i % 16, len = stepLen();
      if (i % 16 === 0) barPat = Math.floor(Math.random() * ARP_PATS.length);

      const idx = ARP_PATS[barPat][s];

      if (mode === 4) return stepEvent4(t, i);

      if (i % 16 === 0) barPat = Math.floor(Math.random() * ARP_PATS.length);

      }
    }

    function riser(dur) {
      const t = ctx.currentTime + 0.05;
      const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 2.2;

    function portal() {

    function tick() {
      const now = ctx.currentTime;
      while (nextChord < now + 1.2) { playChord(Math.max(nextChord, now + 0.05)); nextChord += CHORD_LEN[mode]; }
      if (mode === 1 || mode === 4) {

        while (nextStep < now + 0.35) {

        while (nextBell < now + 0.6) {

    }

    function applyMode(t) {
      const d = PD[mode];
      N.dL.delayTime.setTargetAtTime(d.delay, t, 0.35); N.dR.delayTime.setTargetAtTime(d.delay, t, 0.35);

      N.fbL.gain.setTargetAtTime(0.32 + q * 0.3, t, 0.5); N.fbR.gain.setTargetAtTime(0.32 + q * 0.3, t, 0.5);

    return {
      get on() { return on; },
      async start() {

      },
      stop() {

      setKey(i) { key = i; if (ctx && timer) restartPhrase(); },
      setMode(m) { mode = m; if (ctx && timer) { restartPhrase(); applyMode(ctx.currentTime); } },
      setTrip(i) { tripIdx = i; if (ctx && N) applyTrip(ctx.currentTime); },
      setWarp(w) { warp = w; if (ctx && N) N.padFilter.frequency.setTargetAtTime(PAD_FILTER[mode] + w * 2400, ctx.currentTime, 0.4); },

      }
    };
  })();

  /* ============ PICTURE ============
     Each world draws into a texture. A post pass adds colour split, video feedback and (at Deep) a mirrored overlay.
     Changing world opens a portal between two textures instead of cutting. */
  const canvas = document.getElementById("view");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let gl = null, W = 0, H = 0, scale = 0.7;
  const maxScale = 1;
  const SCENE_PROGS = [];
  let POST = null, TRANS = null, BLIT = null, TG = null, pflip = 0;
  let mode = 0, trans = null, queuedMode = -1;
  const TRANS_DUR = 2.4;
  const SCENE_NAMES = ["R", "T", "Z", "M", "W", "A", "Q", "F", "H", "pa", "pb", "pc", "pd"];

  const POST_FRAG = `precision highp float;
uniform sampler2D tS; uniform sampler2D tP; uniform vec2 R; uniform float T; uniform float Q; uniform float A; uniform float H;
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
vec3 hue(vec3 c, float a){ vec3 k = vec3(0.57735); float co = cos(a), si = sin(a); return c * co + cross(k, c) * si + k * dot(k, c) * (1.0 - co); }
void main(){
  vec2 uv = gl_FragCoord.xy / R;
  vec2 c = uv - 0.5;
  float asp = R.x / R.y;
  float K = smoothstep(0.62, 1.0, Q);
  vec2 cc = vec2(c.x * asp, c.y);
  float ang = atan(cc.y, cc.x), rad = length(cc);
  float seg = 6.28318 / 6.0;
  float fa = abs(mod(ang + T * 0.03, seg) - seg * 0.5);
  vec2 fc = vec2(cos(fa), sin(fa)) * rad;
  vec2 fuv = vec2(fc.x / asp, fc.y) + 0.5;
  float ca = (0.0008 + 0.0065 * Q + 0.006 * A) * (0.4 + length(c) * 2.0);
  vec2 d = normalize(c + 1e-5) * ca;
  vec3 s = vec3(texture2D(tS, uv + d).r, texture2D(tS, uv).g, texture2D(tS, uv - d).b);
  vec3 sk = vec3(texture2D(tS, fuv + d).r, texture2D(tS, fuv).g, texture2D(tS, fuv - d).b);
  s = mix(s, max(s, sk * 0.85), K * 0.4);
  vec2 pc = c * (1.0 - (0.004 + 0.012 * Q + 0.012 * A) * step(0.001, Q));
  pc = rot(0.0025 * Q + 0.004 * Q * sin(T * 0.3)) * (pc * vec2(asp, 1.0)) / vec2(asp, 1.0);
  vec3 prev = texture2D(tP, pc + 0.5).rgb;
  prev = hue(prev, 0.022 * Q + 0.012 * K);
  float decay = Q * (0.7 + 0.1 * K);
  vec3 col = max(s, prev * decay - 0.012);
  float l = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(vec3(l), col, 1.0 + 0.22 * Q);
  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;
  const TRANS_FRAG = `precision highp float;
uniform sampler2D tA; uniform sampler2D tB; uniform vec2 R; uniform float P; uniform float T;
void main(){
  vec2 uv = gl_FragCoord.xy / R;
  float asp = R.x / R.y;
  vec2 c = (uv - 0.5) * vec2(asp, 1.0);
  float r = length(c);
  float e = P * P * (3.0 - 2.0 * P);
  float rf = e * 1.6 - 0.12;
  float x = r - rf;
  float ring = exp(-abs(x) * 9.0);
  vec2 dir = normalize(c + 1e-5) / vec2(asp, 1.0);
  vec2 w = dir * (sin(x * 38.0 - T * 6.0) * ring * 0.03 - x * ring * 0.12);
  float m = 1.0 - smoothstep(-0.07, 0.07, x);
  float ca = ring * 0.02;
  vec3 a = vec3(texture2D(tA, uv + w + dir * ca).r, texture2D(tA, uv + w).g, texture2D(tA, uv + w - dir * ca).b);
  vec3 b = vec3(texture2D(tB, uv + w + dir * ca).r, texture2D(tB, uv + w).g, texture2D(tB, uv + w - dir * ca).b);
  vec3 col = mix(a, b, m);
  col += vec3(0.8, 0.55, 1.0) * ring * ring * 0.5 * sin(P * 3.14159);
  gl_FragColor = vec4(col, 1.0);
}`;
  const BLIT_FRAG = `precision mediump float;
uniform sampler2D tS; uniform vec2 R;
void main(){ gl_FragColor = vec4(texture2D(tS, gl_FragCoord.xy / R).rgb, 1.0); }`;

  function compileProg(frag, names) {
    const sh = (type, src) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
      return s;
    };
    const vs = sh(gl.VERTEX_SHADER, VERT), fs = sh(gl.FRAGMENT_SHADER, frag);
    if (!vs || !fs) return null;
    const prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); return null; }
    const U = {}; names.forEach(n => { U[n] = gl.getUniformLocation(prog, n); });
    return { prog, U, loc: gl.getAttribLocation(prog, "a") };
  }
  function bindProg(p) { gl.useProgram(p.prog); gl.enableVertexAttribArray(p.loc); gl.vertexAttribPointer(p.loc, 2, gl.FLOAT, false, 0, 0); }
  function sceneProg(m) {
    if (SCENE_PROGS[m] === undefined) SCENE_PROGS[m] = compileProg(SHADERS[m], SCENE_NAMES);
    return SCENE_PROGS[m] || (m !== 0 ? sceneProg(0) : null);
  }

  function mkTarget() {
    const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tx, 0);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    return { t: tx, f };
  }
  function freeTargets() {
    if (!TG) return;
    [TG.S, TG.A, TG.B, TG.P[0], TG.P[1]].forEach(o => { gl.deleteTexture(o.t); gl.deleteFramebuffer(o.f); });
    TG = null;
  }
  function allocTargets() {
    freeTargets();
    TG = { S: mkTarget(), A: mkTarget(), B: mkTarget(), P: [mkTarget(), mkTarget()] };
    pflip = 0;
  }
  function init() {
    gl = canvas.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" });
    if (!gl) { document.getElementById("fallback").style.display = "flex"; return false; }
    SCENE_PROGS.length = 0; TG = null;
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    POST = compileProg(POST_FRAG, ["tS", "tP", "R", "T", "Q", "A", "H"]);
    TRANS = compileProg(TRANS_FRAG, ["tA", "tB", "R", "P", "T"]);
    BLIT = compileProg(BLIT_FRAG, ["tS", "R"]);
    if (!POST || !TRANS || !BLIT || !sceneProg(mode)) { document.getElementById("fallback").style.display = "flex"; return false; }
    resize();
    return true;
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = Math.max(2, Math.floor(window.innerWidth * dpr * scale));
    H = Math.max(2, Math.floor(window.innerHeight * dpr * scale));
    canvas.width = W; canvas.height = H;
    if (gl) { gl.viewport(0, 0, W, H); allocTargets(); }
  }
  let rt = null;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 120); });

  /* ---------- state shared with the shaders ---------- */
  let T = 12, Z = 0, warp = 0, pulse = 0, hue = 0, Qs = 0.55, jb = 0;
  const sm = { x: 0, y: 0 };
  let pi = 0, tripIdx = 1, paused = false, audioTrip = -1;
  const pcur = PALETTES[0].p.map(v => v.slice());

  function setSceneUniforms(p) {
    const U = p.U;
    gl.uniform2f(U.R, W, H); gl.uniform1f(U.T, T); gl.uniform1f(U.Z, Z);
    gl.uniform2f(U.M, sm.x, sm.y); gl.uniform1f(U.W, warp); gl.uniform1f(U.A, pulse);
    gl.uniform1f(U.Q, Qs); gl.uniform1f(U.F, 1); gl.uniform1f(U.H, hue);
    gl.uniform3fv(U.pa, pcur[0]); gl.uniform3fv(U.pb, pcur[1]); gl.uniform3fv(U.pc, pcur[2]); gl.uniform3fv(U.pd, pcur[3]);
  }
  function drawTo(fbo) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.viewport(0, 0, W, H); gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function renderScene(m, target) {
    const p = sceneProg(m); bindProg(p); setSceneUniforms(p); drawTo(target.f);
  }
  function bindTex(unit, tex) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); }

  function drawFrame() {
    if (trans) {
      renderScene(mode, TG.A); renderScene(trans.to, TG.B);
      bindProg(TRANS);
      bindTex(0, TG.A.t); bindTex(1, TG.B.t);
      gl.uniform1i(TRANS.U.tA, 0); gl.uniform1i(TRANS.U.tB, 1);
      gl.uniform2f(TRANS.U.R, W, H); gl.uniform1f(TRANS.U.P, trans.p); gl.uniform1f(TRANS.U.T, T);
      drawTo(TG.S.f);
    } else {
      renderScene(mode, TG.S);
    }
    // colour split + feedback into the other post texture, then to the screen
    const w = pflip, r = 1 - pflip;
    bindProg(POST);
    bindTex(0, TG.S.t); bindTex(1, TG.P[r].t);
    gl.uniform1i(POST.U.tS, 0); gl.uniform1i(POST.U.tP, 1);
    gl.uniform2f(POST.U.R, W, H); gl.uniform1f(POST.U.T, T); gl.uniform1f(POST.U.Q, Qs); gl.uniform1f(POST.U.A, pulse); gl.uniform1f(POST.U.H, hue);
    drawTo(TG.P[w].f);
    bindProg(BLIT);
    bindTex(0, TG.P[w].t); gl.uniform1i(BLIT.U.tS, 0); gl.uniform2f(BLIT.U.R, W, H);
    drawTo(null);
    pflip = r;
  }

  /* ---------- input ---------- */
  const mouse = { x: 0, y: 0, active: false, last: 0, down: false };
  const hint = document.getElementById("hint");
  const HINT_TEXT = hint.textContent;
  setTimeout(() => { if (!soundPending) hint.classList.add("quiet"); }, 12000);
  function touch(e) {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -((e.clientY / window.innerHeight) * 2 - 1);
    mouse.active = true; mouse.last = performance.now();
  }
  canvas.addEventListener("pointermove", touch);
  canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); mouse.down = true; canvas.classList.add("down"); touch(e); });
  const release = () => { mouse.down = false; canvas.classList.remove("down"); };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  /* ---------- controls ---------- */
  const journey = { on: false, t0: 0, riser: false };
  const DWELL = 10, BOOST_LEN = 4;
  const target = () => (queuedMode >= 0 ? queuedMode : trans ? trans.to : mode);
  function caption() {
    document.getElementById("caption").textContent = (journey.on ? "Journey · " : "") + MODE_NAMES[target()] + " · " + PALETTES[pi].name;
  }
  function paintModeButtons() {
    const m = target();
    document.querySelectorAll(".modes .txt").forEach((b, n) => b.setAttribute("aria-pressed", n === m ? "true" : "false"));
  }
  function setPalette(i) {
    pi = i; Sound.setKey(i); caption();
    document.querySelectorAll(".dot").forEach((b, n) => b.setAttribute("aria-pressed", n === i ? "true" : "false"));
  }
  function startTransition(to) {
    trans = { to, p: 0, fired: false };
    Sound.portal();
  }
  function setMode(m) {
    m = (m + NMODES) % NMODES;
    if (trans) { if (m !== trans.to) queuedMode = m; else queuedMode = -1; }
    else if (m !== mode) startTransition(m);
    paintModeButtons(); caption();
  }
  const userMode = m => { if (journey.on) journey.t0 = performance.now(); journey.riser = false; setMode(m); };
  function setTrip(i) {
    tripIdx = (i + 3) % 3;
    document.getElementById("tripLabel").textContent = TRIP[tripIdx].name;
    document.getElementById("trip").setAttribute("aria-label", "Intensity: " + TRIP[tripIdx].name);
  }
  document.querySelectorAll(".dot").forEach(b => b.addEventListener("click", () => setPalette(+b.dataset.i)));
  document.querySelectorAll(".modes .txt").forEach(b => b.addEventListener("click", () => userMode(+b.dataset.m)));
  document.getElementById("trip").addEventListener("click", () => setTrip(tripIdx + 1));

  // Journey: dwell in each world, build to a peak, then a portal into the next one with a new colour
  const prog = document.getElementById("prog"), journeyBtn = document.getElementById("journey");
  function toggleJourney() {
    journey.on = !journey.on; journey.t0 = performance.now(); journey.riser = false;
    journeyBtn.setAttribute("aria-pressed", journey.on ? "true" : "false");
    prog.classList.toggle("on", journey.on);
    if (!journey.on) prog.style.transform = "scaleX(0)";
    caption();
  }
  journeyBtn.addEventListener("click", toggleJourney);
  function toggleFull() {
    const el = document.documentElement;
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } catch (e) {}
  }
  document.getElementById("full").addEventListener("click", toggleFull);

  // Sound starts on. Browsers only allow audio after a touch, click or key press, so it begins on the first one.
  const soundBtn = document.getElementById("sound"), soundLabel = document.getElementById("soundLabel");
  let soundPending = true;
  const GESTURES = ["pointerup", "click", "keydown", "touchend"];
  function setSoundUi(on) {
    soundBtn.setAttribute("aria-pressed", on ? "true" : "false");
    soundLabel.textContent = on ? "Sound on" : "Sound";
  }
  function hintNormal() {
    hint.textContent = HINT_TEXT; hint.classList.remove("pending", "quiet");
    setTimeout(() => hint.classList.add("quiet"), 12000);
  }
  function armGestures(on) { GESTURES.forEach(ev => (on ? window.addEventListener : window.removeEventListener).call(window, ev, onGesture, true)); }
  function onGesture(e) {
    if (!soundPending) return;
    if (e.target && e.target.closest && e.target.closest("#sound")) return;
    if (e.type === "keydown" && (e.key === "m" || e.key === "M")) return;
    beginSound();
  }
  async function beginSound() {
    armGestures(false);
    const ok = await Sound.start();
    soundPending = false;
    if (!ok) { soundBtn.setAttribute("aria-pressed", "false"); soundLabel.textContent = "No audio"; hintNormal(); return; }
    setSoundUi(true); hintNormal();
  }
  async function toggleSound() {
    if (soundPending) { soundPending = false; armGestures(false); hintNormal(); setSoundUi(false); return; }
    if (Sound.on) Sound.stop();
    else { const ok = await Sound.start(); if (!ok) { soundLabel.textContent = "No audio"; return; } }
    setSoundUi(Sound.on);
  }
  soundBtn.addEventListener("click", toggleSound);
  if (Sound.probe()) beginSound();
  else { hint.textContent = "Touch anywhere to start the sound"; hint.classList.add("pending"); armGestures(true); }

  window.addEventListener("keydown", e => {
    if (e.key >= "1" && e.key <= "4") setPalette(+e.key - 1);
    else if (e.key === "ArrowRight") userMode(target() + 1);
    else if (e.key === "ArrowLeft") userMode(target() - 1);
    else if (e.key === "j" || e.key === "J") toggleJourney();
    else if (e.key === "f" || e.key === "F") toggleFull();
    else if (e.key === "m" || e.key === "M") toggleSound();
    else if (e.key === "t" || e.key === "T") setTrip(tripIdx + 1);
    else if (e.code === "Space" && document.activeElement === document.body) { e.preventDefault(); paused = !paused; }
  });
  document.addEventListener("visibilitychange", () => Sound.suspendForHidden(document.hidden));

  /* ---------- loop ---------- */
  let last = performance.now(), acc = 0, frames = 0;
  const baseSpeed = reduce ? 0.35 : 0.9;

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (paused || !TG) return;

    // portal progress; the music changes world while the screen is mostly covered
    if (trans) {
      trans.p = Math.min(1, trans.p + dt / TRANS_DUR);
      if (!trans.fired && trans.p > 0.4) { trans.fired = true; Sound.setMode(trans.to); }
      if (trans.p >= 1) {
        mode = trans.to; trans = null;
        if (queuedMode >= 0 && queuedMode !== mode) { const q = queuedMode; queuedMode = -1; startTransition(q); }
        else queuedMode = -1;
      }
    }

    // journey schedule
    let jbTarget = 0;
    if (journey.on) {
      const el = (now - journey.t0) / 1000;
      prog.style.transform = "scaleX(" + Math.min(1, el / DWELL).toFixed(4) + ")";
      if (el > DWELL - BOOST_LEN) {
        const k = (el - (DWELL - BOOST_LEN)) / BOOST_LEN;
        jbTarget = Math.min(1, k * k * (3 - 2 * k) * 1.1);
        if (!journey.riser) { journey.riser = true; Sound.riser(BOOST_LEN - 0.6); }
      }
      if (el >= DWELL && !trans) {
        journey.t0 = now; journey.riser = false;
        setPalette((pi + 1) % PALETTES.length);
        setMode(target() + 1);
      }
    }
    jb += (jbTarget - jb) * (1 - Math.pow(jbTarget > jb ? 0.3 : 0.06, dt));

    const idle = !mouse.active || now - mouse.last > 4000;
    const tx = idle ? 0.55 * Math.sin(T * 0.13) : mouse.x;
    const ty = idle ? 0.35 * Math.sin(T * 0.09 + 1.0) : mouse.y;
    const k = 1 - Math.pow(0.02, dt);
    sm.x += (tx - sm.x) * k; sm.y += (ty - sm.y) * k;
    warp += ((mouse.down ? 1 : 0) - warp) * (1 - Math.pow(0.05, dt));
    const qWant = Math.max(TRIP[tripIdx].q, jb);
    Qs += (qWant - Qs) * (1 - Math.pow(0.1, dt));
    const speed = baseSpeed + (warp + jb * 0.5) * 3.2 * (reduce ? 0.4 : 1);
    T += dt; Z += dt * speed; hue += dt * (Qs * 0.018 + jb * 0.05) * (reduce ? 0.3 : 1);
    Sound.setWarp(Math.max(warp, jb * 0.6));
    const wantAudio = jb > 0.55 ? 2 : tripIdx;
    if (wantAudio !== audioTrip) { audioTrip = wantAudio; Sound.setTrip(wantAudio); }

    const lv = Sound.level();
    pulse += (lv - pulse) * (lv > pulse ? 0.5 : 1 - Math.pow(0.15, dt));
    for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) pcur[r][c] += (PALETTES[pi].p[r][c] - pcur[r][c]) * (1 - Math.pow(0.12, dt));

    drawFrame();

    acc += dt; frames++;
    if (frames === 40) {
      const avg = acc / frames; acc = 0; frames = 0;
      if (avg > 0.026 && scale > 0.36) { scale = Math.max(0.36, scale * 0.86); resize(); }
      else if (avg < 0.0145 && scale < maxScale && !trans) { scale = Math.min(maxScale, scale * 1.08); resize(); }
    }
  }

  canvas.addEventListener("webglcontextlost", e => e.preventDefault());
  canvas.addEventListener("webglcontextrestored", () => { init(); });
  if (init()) requestAnimationFrame(frame);
})();
</script>

</body></html>
